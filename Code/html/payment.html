<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">

<head>
    <title>Payment</title>
    <link rel="stylesheet" href="../css/payment.css">
    <link rel="icon" type="image/png" href="../../Assets/icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="header">

        <div class="logo">
            <a href="home.html">
                <img src="../../Assets/logo_red.png" alt="AmritaDormDashLogo" >
            </a>
        </div>

        <div class="searchbar">
            <input type="text" placeholder="Search...">
            <button>
                <img src="../../Assets/search_icon.png" alt="SearchIcon">
            </button>
        </div>

        <div class="cart_logout">
            <div class="cart">
                <a href="cart.html">
                    <button>
                        <img src="../../Assets/cart_icon.png" alt="Cart icon">
                    </button>
                </a>
            </div>
    
            <div class="profile_icon">
                <a href="login.html">
                    <button>
                        <img src="../../Assets/logout_icon.png" alt="Profile icon" id = "logout">
                    </button>
                </a>
            </div>
        </div>

    </div>


    <div class="payment">
        <span>PAYMENT</span>
    </div>


    <!-- <div class="payment-options"> -->
        <ul>
            <li>
                <a href="#"  onclick="window.open('paymentsuccess.html', 'newWindow', 'width=1000,height=600,left=250,top=200'); return false;">
                    <div class="payment-mode">
                        <img src="../../Assets/online_mode.jpg" style="transform: translateX(-120px);"/>
                    </div>
                </a>
            </li>
            <li>
                <a href="#" onclick="window.open('order_placed.html', 'newWindow', 'width=1000,height=600,left=250,top=200'); return false;">  
                    <div class="payment-mode">
                        <img src="../../Assets/cod_icon.png"/>
                    </div>
                </a>
            </li>
        </ul>
    <!-- </div> -->


</body>
</html>
