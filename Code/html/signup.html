<!DOCTYPE html>
<html lang="en">
<head>
    <title>Amrita DormDash Sign Up</title>
    <link rel="stylesheet" href="../css/signup.css">
    <link rel="icon" type="image/png" href="../../Assets/icon.png">
    <script src="../js/signup.js" defer></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    
</head>
<body>
    <div class="slideshow-container">

        
        <div class="header">
            <img src="../../Assets/logo_red.png" alt="AMRITA DormDash">
        </div>
        <div class="container">
            <div class="signup-box success">
                <h2>Sign Up</h2>
            <form action="" id="form">
                <div class="input-container">
                    <input type="text" id="name" class="name" placeholder="Name">
                    <div class="error"></div>
                </div>
                <div class="input-container">
                    <input type="email" id="email" class="collegeemailid" placeholder="College Email ID">
                    <div class="error"></div>
                </div>
                <div class="input-container">
                    <input type="password" id="password" class="password" placeholder="Password">
                    <div class="error"></div>
                </div>
                <div class="input-container">
                    <input type="tel" id="phone" class="phone" placeholder="Phone No.">
                    <div class="error"></div>
                </div>
                <button type="submit" class="signup-btn">Sign Up</button>
                <div class="signin-link">
                    Already have an account? <a href="../html/login.html" >LOGIN</a>
                </div>
            </form>
        </div>
    </div>
</body>
<script src="../js/signup.js" defer></script>
</html>
