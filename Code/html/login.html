<!DOCTYPE html>
<html lang="en">
<head>
    <title>Amrita DormDash Sign Up</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" type="image/png" href="../../Assets/icon.png">
    <script src="../js/login.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

</head>
<body>
    <div class="header">
        <img src="../../Assets/logo_red.png" alt="AMRITA DormDash">
    </div>
    <div class="container">
        <div class="signup-box">
            <h2>LOGIN</h2>
            <form action="" id="form">
                <input type="text" id="name" class="name" placeholder="Name">
                <div id="nameError" class="error"></div>
                <input type="email" id="email" class="collegeemailid" placeholder="College Email ID">
                <div id="emailError" class="error"></div>
                <input type="password" id="password" class="password" placeholder="Password">
                <div id="passwordError" class="error"></div>
                <button type="submit" class="signup-btn">LOGIN</button>
                <div id="formError" class="error"></div>
            </form>
            <div class="signin-link">
                Do not have an account? <a href="../html/signup.html" >SIGN UP</a>
            </div>
        </div>
    </div>
</body>
</html>
